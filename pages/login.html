<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="../index.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CriptoMentor - Dynamic Dashboard</title>
 
  <script src="https://cdn.tailwindcss.com"></script>
 
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body class="relative min-h-screen flex items-center justify-center w-full">

  <div class="grid-background"></div>
 
  <div class="ambient-glow"></div>

  <div class="chart-container-bg chart-top-left">
    <canvas id="btcChart"></canvas>
  </div>
  <div class="chart-container-bg chart-bottom-right">
    <canvas id="ethChart"></canvas>
  </div>

  <main class="relative z-10 w-full max-w-md px-6">
    <div class="glass-card rounded-2xl p-8 sm:p-10 flex flex-col items-center w-full">
     
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-800 to-black border border-gray-600 flex items-center justify-center mb-6 logo-glow">
        <span class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-400 to-red-500">
          C
        </span>
      </div>

      <h1 class="text-3xl font-bold text-white mb-2 tracking-wide">CriptoMentor</h1>
      <p class="text-sm text-gray-400 mb-8 text-center">Tu asistente de IA para crypto activity map</p>

      <form class="w-full space-y-5" onsubmit="event.preventDefault();">
       
        <div class="space-y-1">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">Correo Electrónico</label>
          <div class="relative input-group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-envelope text-gray-500 input-icon transition-colors"></i>
            </div>
            <input type="email" placeholder="tu@email.com" required
              class="custom-input w-full pl-11 pr-4 py-3 rounded-xl text-white placeholder-gray-600 text-sm">
          </div>
        </div>

        <div class="space-y-1">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider pl-1">Contraseña</label>
          <div class="relative input-group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i class="fa-solid fa-lock text-gray-500 input-icon transition-colors"></i>
            </div>
            <input type="password" id="passwordInput" placeholder="Ingresa tu contraseña" required
              class="custom-input w-full pl-11 pr-12 py-3 rounded-xl text-white placeholder-gray-600 text-sm">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-500 hover:text-white transition-colors">
              <i class="fa-solid fa-eye-slash" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 mt-4 rounded-xl font-semibold text-white shadow-lg
             bg-gradient-to-r from-orange-500 to-red-600
             hover:from-orange-400 hover:to-red-500
             transform transition-all duration-200 hover:scale-[1.02] active:scale-[0.98]">
          Iniciar Sesión
        </button>
      </form>

      <div class="mt-8 text-sm text-gray-400">
        ¿No tienes una cuenta?
        <a href="#" class="text-blue-400 hover:text-blue-300 font-semibold transition-colors">Regístrate aquí</a>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
