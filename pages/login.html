<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CriptoMentor - Iniciar Sesión</title>
    <style>
        .top-links-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            padding: 14px 0;
            z-index: 1000;
        }

        .top-links-container {
            display: flex;
            justify-content: center;
            gap: 36px;
            padding: 0 20px;
        }

        .top-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: opacity 0.2s ease;
        }

        .top-link:hover {
            opacity: 0.65;
            text-decoration: underline;
        }

        .top-link:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
            border-radius: 2px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        
        input.error {
            border-color: #ef4444 !important;
            animation: shake 0.3s ease-in-out;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #8b949e;
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #30363d;
        }
        .divider::before { margin-right: .75em; }
        .divider::after { margin-left: .75em; }

        .google-btn {
            width: 100%;
            background-color: #ffffff;
            color: #24292e;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .google-btn:hover {
            background-color: #f3f4f6;
        }

        @media (max-width: 480px) {
            .top-links-container {
                gap: 20px;
            }
            .top-link {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <nav class="top-links-bar">
        <div class="top-links-container">
            <a href="contacto.html" class="top-link">Contacto</a>
            <a href="nosotros.html" class="top-link">Nosotros</a>
            <a href="Inicio.html" class="top-link">Inicio</a>
        </div>
    </nav>

    <main class="login-container">
        <div class="login-header">
            <h1 class="login-logo">CriptoMentor</h1>
            <p class="login-subtitle">Tu asistente de IA para empezar a invertir</p>
        </div>
        
        <form class="login-form" id="loginform">
            <div class="form-group">
                <label for="email">correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="password">contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                        <svg class="icon-eye" id="iconEye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" id="iconEyeOff" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">Iniciar Sesión</button>
        </form>

        <div class="divider">o continúa con</div>

        <button type="button" class="google-btn" id="googleLoginBtn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.16 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.12 0 9.8 0 12s.43 3.88 1.18 5.38l4.09-3.14z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.16 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Google
        </button>

        <p class="register-text">
            ¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a>
        </p>
    </main>

    <script src="login.js" defer></script>
</body>
</html>
